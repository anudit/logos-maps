[package]
name = "osm-registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]
exclude = ["guest"]

[dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core", features = ["host"] }
spel-framework = { git = "https://github.com/logos-co/spel", rev = "415b7bcbe7a3bd95ec9e34aef41f5e41d51f0f9c" }
spel-framework-core = { git = "https://github.com/logos-co/spel", rev = "415b7bcbe7a3bd95ec9e34aef41f5e41d51f0f9c", features = ["idl-gen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[[bin]]
name = "generate-idl"
path = "src/idl.rs"
