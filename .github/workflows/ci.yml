name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: registry
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_partition.py
      - run: cargo test --locked --manifest-path registry/Cargo.toml
      - name: Verify generated IDL and packaged SDK are current
        run: |
          cargo run --locked --manifest-path registry/Cargo.toml --bin generate-idl > registry/idl.json
          python3 scripts/package_sdk.py
          git diff --exit-code -- registry/idl.json modules/osm_registry/idl.json modules/osm_registry/maps_sdk.pyz

  integration-and-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libssl-dev libclang-dev pkg-config libegl1
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
            accept-flake-config = true
      - name: Install versioned RISC Zero tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://risczero.com/install -o /tmp/install-rzup.sh
          bash /tmp/install-rzup.sh -q
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install rust 1.97.0
          "$HOME/.risc0/bin/rzup" install cargo-risczero 3.0.5
      - name: Fetch pinned protocol sources
        run: |
          mkdir -p .tools
          git clone --depth 1 --branch v0.2.4 https://github.com/logos-blockchain/logos-execution-zone .tools/lez
          git clone https://github.com/logos-co/spel .tools/spel
          git -C .tools/spel checkout 415b7bcbe7a3bd95ec9e34aef41f5e41d51f0f9c
      - name: Build wallet, SPEL and real standalone sequencer
        run: |
          cargo build --release --manifest-path .tools/lez/Cargo.toml -p wallet -p sequencer_service --features sequencer_service/standalone
          cargo build --release --manifest-path .tools/spel/Cargo.toml -p spel
          cargo build --locked --manifest-path registry/methods/Cargo.toml
      - name: Build native Storage and both module packages
        run: |
          nix build 'github:logos-co/logos-storage-module/7548f41ae189917d58c37f0fb6d3a2700b99f59b#lib' -o storage-result
          nix build 'path:./modules/osm_registry#lgx-portable' -o sdk-result
          nix build 'path:./modules/osm_distribution#lgx-portable' -o app-result
          nix build 'path:./examples/consumer#lgx-portable' -o consumer-result
          mkdir -p artifacts
          find -L sdk-result app-result consumer-result -name '*.lgx' -exec cp {} artifacts/ \;
          python3 scripts/check_packages.py artifacts/*.lgx
      - name: Real sequencer and native Storage end-to-end pipeline
        run: |
          library=$(find -L storage-result/lib -maxdepth 1 -name 'libstorage.*' | head -1)
          python3 scripts/integration.py --lez-source .tools/lez --storage-library "$library" \
            --spel "$PWD/.tools/spel/target/release/spel" \
            --wallet "$PWD/.tools/lez/target/release/wallet" --r0vm "$(command -v r0vm)"
      - uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.os }}
          path: |
            artifacts/*.lgx
            evidence/standalone.json
