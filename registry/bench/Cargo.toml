[package]
name = "osm-registry-cycle-bench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
osm-registry = { path = ".." }
osm-registry-methods = { path = "../methods" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core", features = ["host"] }
spel-framework-core = { git = "https://github.com/logos-co/spel", rev = "415b7bcbe7a3bd95ec9e34aef41f5e41d51f0f9c" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
serde_json = "1"
borsh = "1"
